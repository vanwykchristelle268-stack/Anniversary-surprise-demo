<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Anniversary 💜</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffe6f2, #e8d5ff, #fff0f5);
    min-height: 100vh;
    text-align: center;
    color: #69416e;
    overflow-x: hidden;
}

.container {
    max-width: 750px;
    margin: auto;
    padding: 70px 20px;
    position: relative;
    z-index: 2;
}

h1 {
    font-size: 3rem;
    margin-bottom: 20px;
    animation: fadeIn 2s ease;
}

.subtitle {
    font-size: 1.3rem;
    margin-bottom: 35px;
    line-height: 1.8;
}

.heart {
    font-size: 75px;
    animation: heartbeat 1.5s infinite;
    margin-bottom: 30px;
}

button {
    background: #b57acb;
    color: white;
    border: none;
    padding: 17px 35px;
    font-size: 1.1rem;
    border-radius: 35px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
}

button:hover {
    background: #9555b3;
    transform: scale(1.05);
}

.surprise {
    display: none;
    background: rgba(255,255,255,0.85);
    margin-top: 45px;
    padding: 35px;
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    animation: fadeIn 1.5s ease;
}

.surprise h2 {
    color: #a45ab5;
    margin-bottom: 20px;
}

.surprise p {
    font-size: 1.15rem;
    line-height: 2;
}

.signature {
    margin-top: 25px;
    font-style: italic;
    color: #a45ab5;
}

.floating-heart {
    position: fixed;
    bottom: -50px;
    pointer-events: none;
    animation: floatUp linear forwards;
    z-index: 1;
}

footer {
    margin-top: 60px;
    font-size: 0.85rem;
    opacity: 0.7;
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.2);
    }
}
